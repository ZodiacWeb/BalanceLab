        const { useState, useEffect, useMemo, useRef, useLayoutEffect, useCallback } = React;

        // --- COMPONENT: Auto Scale to Fit (ป้องกัน Infinite Loop) ---
        const ScaleToFit = ({ children, className = "justify-center" }) => {
            const containerRef = useRef(null);
            const contentRef = useRef(null);
            const [scale, setScale] = useState(1);

            const updateScale = useCallback(() => {
                if (containerRef.current && contentRef.current) {
                    const containerWidth = containerRef.current.offsetWidth;
                    const contentWidth = contentRef.current.scrollWidth;
                    if (contentWidth > containerWidth && contentWidth > 0) {
                        const newScale = Number((containerWidth / contentWidth).toFixed(3));
                        setScale(prev => Math.abs(prev - newScale) > 0.01 ? newScale : prev);
                    } else {
                        setScale(prev => prev !== 1 ? 1 : prev);
                    }
                }
            }, []);

            useLayoutEffect(() => {
                updateScale();
                window.addEventListener('resize', updateScale);
                const observer = new MutationObserver(updateScale);
                if (contentRef.current) {
                    observer.observe(contentRef.current, { subtree: true, childList: true, characterData: true });
                }
                return () => {
                    window.removeEventListener('resize', updateScale);
                    observer.disconnect();
                };
            }, [updateScale, children]);

            return (
                <div ref={containerRef} className={`w-full flex overflow-hidden ${className}`}>
                    <div ref={contentRef} style={{ transform: `scale(${scale})`, transformOrigin: className.includes('justify-start') ? 'left center' : 'center center', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center' }}>
                        {children}
                    </div>
                </div>
            );
        };

        // --- AUDIO SYSTEM (Web Audio API) ---
        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            play(freq, type, duration, vol, delay = 0) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + delay + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            },
            click(enabled) {
                if (!enabled) return;
                this.play(600, 'sine', 0.05, 0.05);
            },
            success(enabled) {
                if (!enabled) return;
                this.play(523.25, 'sine', 0.1, 0.1, 0);
                this.play(659.25, 'sine', 0.1, 0.1, 0.1);
                this.play(783.99, 'sine', 0.1, 0.1, 0.2);
                this.play(1046.50, 'sine', 0.3, 0.15, 0.3);
            },
            error(enabled) {
                if (!enabled) return;
                this.play(250, 'square', 0.15, 0.03, 0);
                this.play(200, 'square', 0.25, 0.03, 0.15);
            }
        };

                    {e:"C", x:25, y:5}, {e:"O", x:100, y:35}, {e:"O", x:100, y:65}, {e:"O", x:50, y:105}, {e:"O", x:0, y:65}, {e:"O", x:0, y:5},
                    {e:"H", x:65, y:10}, {e:"H", x:85, y:20}, {e:"H", x:90, y:80}, {e:"H", x:65, y:90}, {e:"H", x:35, y:90}, {e:"H", x:10, y:80},

                ]
            }
        };

        const MoleculeSVG = ({ formula, atomsObj }) => {
            let layout = moleculeLayouts[formula];
            
            if (!layout) {
                let nodes = [], links = [];
                Object.entries(atomsObj).forEach(([a, c]) => {
                    for(let i=0; i<c; i++) nodes.push({e: a});
                });
                
                const count = nodes.length;
                if(count === 1) { 
                    nodes[0].x = 50; nodes[0].y = 50; 
                } else if(count === 2) { 
                    nodes[0].x=35; nodes[0].y=50; nodes[1].x=65; nodes[1].y=50; links=[[0,1]]; 
                } else if(count <= 6) {
                    const r = count > 4 ? 35 : 25;
                    nodes.forEach((n, idx) => {
                        n.x = 50 + r * Math.cos(2 * Math.PI * idx / count);
                        n.y = 50 + r * Math.sin(2 * Math.PI * idx / count);
                        if(idx > 0) links.push([0, idx]);
                    });
                } else {
                    const cols = Math.ceil(Math.sqrt(count));
                    const spacing = 30;
                    const offsetX = 50 - ((cols - 1) * spacing) / 2;
                    const offsetY = 50 - ((Math.ceil(count / cols) - 1) * spacing) / 2;
                    nodes.forEach((n, idx) => {
                        n.x = offsetX + (idx % cols) * spacing;
                        n.y = offsetY + Math.floor(idx / cols) * spacing;
                        if (idx % cols > 0) links.push([idx - 1, idx]);
                        if (Math.floor(idx / cols) > 0) links.push([idx - cols, idx]);
                    });
                }
                layout = { nodes, links };
            }

            const scale = 1.4;
            const scaledNodes = layout.nodes.map(n => ({
                e: n.e,
                x: (n.x - 50) * scale + 50,
                y: (n.y - 50) * scale + 50
            }));

            const radius = 16;
            let maxDist = 0;
            scaledNodes.forEach(n => {
                maxDist = Math.max(maxDist, Math.abs(n.x - 50), Math.abs(n.y - 50));
            });
            const halfSize = maxDist + radius + 4; 
            const size = halfSize * 2;
            const vbX = 50 - halfSize;
            const vbY = 50 - halfSize;

            const safeFormula = formula.replace(/[^a-zA-Z0-9]/g, '');

            return (
                <svg height="80" viewBox={`${vbX} ${vbY} ${size} ${size}`} className="drop-shadow-lg mx-1 my-1 overflow-visible">
                    <defs>
                        <filter id={`shadow-${safeFormula}`}>
                            <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" floodColor="#000000" floodOpacity="0.4" />
                        </filter>
                    </defs>
                    
                    {layout.links.map((link, i) => {
                        const n1 = scaledNodes[link[0]];
                        const n2 = scaledNodes[link[1]];
                        return (
                            <g key={`bond-${i}`}>
                                <line x1={n1.x} y1={n1.y} x2={n2.x} y2={n2.y} stroke="#1e293b" strokeWidth="12" strokeLinecap="round" />
                                <line x1={n1.x} y1={n1.y} x2={n2.x} y2={n2.y} stroke="#94a3b8" strokeWidth="6" strokeLinecap="round" />
                            </g>
                        );
                    })}

                    {scaledNodes.map((n, i) => {
                        const c = getAtomColor(n.e);
                        return (
                            <g key={`atom-${i}`} filter={`url(#shadow-${safeFormula})`}>
                                <circle cx={n.x} cy={n.y} r={radius} fill={c.dark} />
                                <circle cx={n.x} cy={n.y} r={radius} fill={`url(#grad-${safeFormula}-${i})`} />
                                <radialGradient id={`grad-${safeFormula}-${i}`} cx="35%" cy="30%" r="65%">
                                    <stop offset="0%" stopColor={c.light} />
                                    <stop offset="100%" stopColor={c.dark} stopOpacity="0" />
                                </radialGradient>
                                <ellipse cx={n.x - 5} cy={n.y - 6} rx="5" ry="3" fill="#ffffff" opacity="0.6" transform={`rotate(-40 ${n.x - 5} ${n.y - 6})`} />
                                <text x={n.x} y={n.y} fill={c.text} fontSize="14" fontWeight="800" textAnchor="middle" dominantBaseline="central" className="font-sans" style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}>
                                    {n.e}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // --- DATABASE ---
        const db = [
            {

            },
            {
                category: "การสังเคราะห์แสง",
                equations: [
                    { id: "ph1", name: "กระบวนการสังเคราะห์ด้วยแสง", fact: "นี่คือปฏิกิริยาที่สำคัญที่สุดของพืช! เปลี่ยนพลังงานแสงและก๊าซเสียให้กลายเป็นน้ำตาลและออกซิเจนที่เราใช้หายใจ", reactants: [{f: "CO2", s: "g", atoms: {C:1, O:2}}, {f: "H2O", s: "l", atoms: {H:2, O:1}}], products: [{f: "C6H12O6", s: "aq", atoms: {C:6, H:12, O:6}}, {f: "O2", s: "g", atoms: {O:2}}], ans: { r: [6, 6], p: [1, 6] } }
                ]
            }
        ];

        const allEquations = db.flatMap(cat => cat.equations.map(eq => ({ ...eq, categoryName: cat.category })));

        // --- UTILS ---
        const formatFormula = (formula) => {
            const formatted = formula.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
            return <span dangerouslySetInnerHTML={{ __html: formatted }} />;
        };

        // --- COMPONENTS ---

        // 1. Equation Solver
        const EquationSolver = ({ equation, onNext, hideHeader = false, customLogic = null, showStateSymbols = true, showParticles = false, onToggleStateSymbols, onToggleParticles, onSuccessFirstTry, onFail, isTutorial = false, soundEnabled = true }) => {
            const [coeffs, setCoeffs] = useState({ r: [], p: [] });
            const [status, setStatus] = useState('idle');
            const [hint, setHint] = useState('');
            const [attempts, setAttempts] = useState(0);
            const [showAnswerPopup, setShowAnswerPopup] = useState(false);

            useEffect(() => {
                if (customLogic && customLogic.overrideCoeffs) {
                    setCoeffs(customLogic.overrideCoeffs);
                } else {
                    setCoeffs({
                        r: Array(equation.reactants.length).fill(1),
                        p: Array(equation.products.length).fill(1)
                    });
                }
                setStatus('idle');
                setHint('');
                setAttempts(0);
                setShowAnswerPopup(false);
            }, [equation, customLogic?.overrideCoeffs]);

            const adjustCoeff = (side, index, delta) => {
                if (status === 'correct' || (customLogic && customLogic.locked)) return;
                
                Sound.click(soundEnabled);
                
                setCoeffs(prev => {
                    const newSide = [...prev[side]];
                    let newVal = newSide[index] + delta;
                    if (newVal < 1) newVal = 1;
                    if (newVal > 99) newVal = 99;
                    newSide[index] = newVal;
                    
                    const newCoeffs = { ...prev, [side]: newSide };
                    if (customLogic && customLogic.onChange) customLogic.onChange(newCoeffs);
                    return newCoeffs;
                });
                
                if (status === 'incorrect') {
                    setStatus('idle');
                    setHint('');
                }
                if (customLogic && customLogic.status === 'incorrect' && customLogic.setStatus) {
                    customLogic.setStatus('idle');
                }
            };

            const rCounts = {};
            const pCounts = {};
            equation.reactants.forEach((mol, i) => {
                Object.entries(mol.atoms).forEach(([atom, count]) => { rCounts[atom] = (rCounts[atom] || 0) + count * coeffs.r[i]; });
            });
            equation.products.forEach((mol, i) => {
                Object.entries(mol.atoms).forEach(([atom, count]) => { pCounts[atom] = (pCounts[atom] || 0) + count * coeffs.p[i]; });
            });
            
            const allAtoms = Array.from(new Set([...Object.keys(rCounts), ...Object.keys(pCounts)])).sort();
            const isCurrentlyBalanced = allAtoms.every(atom => (rCounts[atom] || 0) === (pCounts[atom] || 0));

            const handleVerify = () => {
                if (customLogic && customLogic.onVerify) {
                    customLogic.onVerify(coeffs);
                } else {
                    const isCorrect = coeffs.r.every((val, i) => val === equation.ans.r[i]) && coeffs.p.every((val, i) => val === equation.ans.p[i]);
                    setAttempts(a => a + 1);

                    if (isCorrect) {
                        Sound.success(soundEnabled);
                        setStatus('correct');
                        setHint(''); 
                        if (attempts === 0 && onSuccessFirstTry && !isTutorial) onSuccessFirstTry();
                    } else {
                        Sound.error(soundEnabled);
                        setStatus('incorrect');
                        if (onFail && !isTutorial) onFail(); 
                        generateHint();
                    }
                }
            };

            const generateHint = () => {
                Sound.click(soundEnabled);
                let foundMismatch = false;
                for (let atom of allAtoms) {
                    const r = rCounts[atom] || 0;
                    const p = pCounts[atom] || 0;
                    if (r !== p) {
                        setHint(`คำใบ้: ลองเช็คอะตอม ${atom} ดูสิ! ฝั่งซ้ายมี ${r} แต่ฝั่งขวามี ${p} นะ`);
                        foundMismatch = true;
                        break;
                    }
                }
                if (!foundMismatch) setHint("สมดุลแล้วนี่นา! ลองกดตรวจสอบคำตอบดูเลย");
            };

            const handleSkip = () => {
                Sound.click(soundEnabled);
                setShowAnswerPopup(true);
            };

            const closePopupAndNext = () => {
                Sound.click(soundEnabled);
                setShowAnswerPopup(false);
                if (onNext) onNext();
            };

            const displayStatus = customLogic && customLogic.status ? customLogic.status : status;

            const renderCurrentEq = () => {
                let html = [];
                equation.reactants.forEach((mol, i) => {
                    if (coeffs.r[i] > 1) html.push(<span key={`cr-${i}`} className="text-orange-500 mr-2 font-bold">{coeffs.r[i]}</span>);
                    html.push(<span key={`mr-${i}`}>{formatFormula(mol.f)}</span>);
                    if (showStateSymbols) html.push(<span key={`sr-${i}`} className="text-sm md:text-base text-slate-400 ml-1">({mol.s})</span>);
                    if (i < equation.reactants.length - 1) html.push(<span key={`pr-${i}`} className="mx-3 text-slate-500 font-bold">+</span>);
                });
                html.push(<span key="arrow" className="mx-4 md:mx-6 text-orange-500 font-bold">→</span>);
                equation.products.forEach((mol, i) => {
                    if (coeffs.p[i] > 1) html.push(<span key={`cp-${i}`} className="text-orange-500 mr-2 font-bold">{coeffs.p[i]}</span>);
                    html.push(<span key={`mp-${i}`}>{formatFormula(mol.f)}</span>);
                    if (showStateSymbols) html.push(<span key={`sp-${i}`} className="text-sm md:text-base text-slate-400 ml-1">({mol.s})</span>);
                    if (i < equation.products.length - 1) html.push(<span key={`pp-${i}`} className="mx-3 text-slate-500 font-bold">+</span>);
                });
                return html;
            };

            // กู้คืนฟังก์ชัน renderParticleEquation ที่หายไป (ตัวการที่ทำให้เปิดโมเดลแล้วจอค้าง)
            const renderParticleEquation = () => {
                return (
                    <div className="flex flex-wrap items-center justify-center w-full px-2 mt-4 gap-y-12">
                        <div className="flex flex-wrap items-center justify-center">
                            {equation.reactants.map((mol, i) => (
                                <React.Fragment key={`pr-${i}`}>
                                    <div className="relative flex justify-center items-center">
                                        <div className="flex flex-wrap justify-center items-center max-w-[280px] gap-2">
                                            {Array.from({length: Math.min(coeffs.r[i] || 1, 12)}).map((_, c) => 
                                                <MoleculeSVG key={c} formula={mol.f} atomsObj={mol.atoms} />
                                            )}
                                        </div>
                                        {(coeffs.r[i] || 1) > 12 && (
                                            <div className="absolute -bottom-7 w-full text-center">
                                                <span className="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded-full">+ {(coeffs.r[i] || 1) - 12}</span>
                                            </div>
                                        )}
                                    </div>
                                    {i < equation.reactants.length - 1 && <div className="text-slate-400 text-3xl font-black mx-4 leading-none mb-1">+</div>}
                                </React.Fragment>
                            ))}
                        </div>
                        
                        <div className="text-orange-500 text-4xl mx-6 font-bold leading-none mb-1">→</div>
                        
                        <div className="flex flex-wrap items-center justify-center">
                            {equation.products.map((mol, i) => (
                                <React.Fragment key={`pp-${i}`}>
                                    <div className="relative flex justify-center items-center">
                                        <div className="flex flex-wrap justify-center items-center max-w-[280px] gap-2">
                                            {Array.from({length: Math.min(coeffs.p[i] || 1, 12)}).map((_, c) => 
                                                <MoleculeSVG key={c} formula={mol.f} atomsObj={mol.atoms} />
                                            )}
                                        </div>
                                        {(coeffs.p[i] || 1) > 12 && (
                                            <div className="absolute -bottom-7 w-full text-center">
                                                <span className="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded-full">+ {(coeffs.p[i] || 1) - 12}</span>
                                            </div>
                                        )}
                                    </div>
                                    {i < equation.products.length - 1 && <div className="text-slate-400 text-3xl font-black mx-4 leading-none mb-1">+</div>}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col items-center w-full max-w-5xl mx-auto space-y-6 animate-fade-in pb-10">
                    
                    {!hideHeader && (
                        <div className="w-full text-center relative">
                            <span className="inline-block px-3 py-1 bg-white/10 rounded-full text-orange-400 text-sm font-semibold mb-2 shadow-sm">
                                {equation.categoryName}
                            </span>
                            <h2 className="text-2xl md:text-3xl font-bold">{equation.name}</h2>
                        </div>
                    )}

                    {/* Box 1: สมการตอนนี้ */}
                    <div id="eq-display" className="glass-dark w-full p-4 md:p-6 rounded-2xl flex flex-col border border-slate-700/50 shadow-md">
                        <div className="flex justify-between items-center w-full mb-3 border-b border-slate-700/30 pb-3">
                            <div className="text-orange-400 text-lg font-semibold flex items-center">
                                <i className="fa-solid fa-flask mr-2 text-xl"></i>สมการตอนนี้
                            </div>
                            <div className={`flex items-center text-lg font-semibold tracking-wide ${isCurrentlyBalanced ? 'text-green-400' : 'text-red-400'}`}>
                                <i className={`fa-solid fa-scale-balanced text-xl mr-2 ${isCurrentlyBalanced ? 'scale-balanced' : 'scale-unbalanced'}`}></i>
                                <span>{isCurrentlyBalanced ? 'สมดุลแล้ว' : 'ยังไม่สมดุล'}</span>
                            </div>
                        </div>
                        
                        <div className="w-full flex items-center justify-center pt-3 pb-3">
                            <ScaleToFit>
                                <div className="flex items-center text-3xl md:text-4xl font-medium tracking-wide">
                                    {renderCurrentEq()}
                                </div>
                            </ScaleToFit>
                        </div>
                    </div>

                    {/* Box 2: Interactive Equation */}
                    <div className="glass w-full p-4 md:p-8 rounded-2xl flex flex-col shadow-lg">
                        <div className="flex justify-between items-center w-full border-b border-slate-700/50 pb-3 mb-5 flex-wrap gap-2">
                            <div className="text-slate-300 text-sm font-medium flex items-center">
                                <i className="fa-solid fa-hand-pointer mr-2 text-slate-400"></i>แตะ + / - เพื่อเปลี่ยนเลขหน้าสาร
                            </div>
                            
                            <div className="flex items-center gap-4">
                                {onToggleParticles && (
                                    <button 
                                        onClick={() => { Sound.click(soundEnabled); onToggleParticles(); }}
                                        className="text-sm font-medium transition-colors flex items-center gap-1.5 cursor-pointer bg-transparent border-none hover:text-white"
                                        style={{ color: showParticles ? '#60a5fa' : '#94a3b8' }}
                                    >
                                        <i className={`fa-solid ${showParticles ? 'fa-circle-nodes' : 'fa-circle'}`}></i>
                                        {showParticles ? 'ปิดโมเดลอนุภาค' : 'เปิดโมเดลอนุภาค'}
                                    </button>
                                )}
                                {onToggleStateSymbols && (
                                    <button 
                                        onClick={() => { Sound.click(soundEnabled); onToggleStateSymbols(); }}
                                        className="text-sm font-medium transition-colors flex items-center gap-1.5 cursor-pointer bg-transparent border-none hover:text-white"
                                        style={{ color: showStateSymbols ? '#4ade80' : '#94a3b8' }}
                                    >
                                        <i className={`fa-solid ${showStateSymbols ? 'fa-eye' : 'fa-eye-slash'}`}></i>
                                        สถานะสาร
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        <div className="w-full flex justify-center pb-4 pt-2">
                            <ScaleToFit>
                                <div className="flex items-start justify-center gap-2 md:gap-4 px-2">
                                    {equation.reactants.map((mol, i) => (
                                        <React.Fragment key={`r-${i}`}>
                                            <div className="flex flex-col items-center">
                                                <div className="flex items-center">
                                                    <div className="flex flex-col items-center no-select mr-2 md:mr-3">
                                                        <button id={`btn-up-r-${i}`} className="btn-control !py-1 !px-2 md:!py-1 md:!px-3" onClick={() => adjustCoeff('r', i, 1)} disabled={displayStatus==='correct' || (customLogic && customLogic.locked)}><i className="fa-solid fa-chevron-up pointer-events-none"></i></button>
                                                        <div className={`coeff-box w-10 h-12 md:w-12 md:h-14 rounded-lg md:rounded-xl flex items-center justify-center text-xl md:text-2xl font-bold ${coeffs.r[i] > 1 ? 'active' : ''}`}>
                                                            {coeffs.r[i]}
                                                        </div>
                                                        <button id={`btn-down-r-${i}`} className="btn-control !py-1 !px-2 md:!py-1 md:!px-3" onClick={() => adjustCoeff('r', i, -1)} disabled={displayStatus==='correct' || (customLogic && customLogic.locked)}><i className="fa-solid fa-chevron-down pointer-events-none"></i></button>
                                                    </div>
                                                    <div className="text-2xl md:text-3xl font-medium flex items-baseline gap-1">
                                                        {formatFormula(mol.f)} 
                                                        {showStateSymbols && <span className="text-sm text-slate-500 font-light ml-1">({mol.s})</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            {i < equation.reactants.length - 1 && <div className="text-slate-500 text-3xl mx-1 md:mx-2 self-center mt-2">+</div>}
                                        </React.Fragment>
                                    ))}

                                    <div className="text-orange-500 text-3xl mx-2 md:mx-4 self-center mt-2">→</div>

                                    {equation.products.map((mol, i) => (
                                        <React.Fragment key={`p-${i}`}>
                                            <div className="flex flex-col items-center">
                                                <div className="flex items-center">
                                                    <div className="flex flex-col items-center no-select mr-2 md:mr-3">
                                                        <button id={`btn-up-p-${i}`} className="btn-control !py-1 !px-2 md:!py-1 md:!px-3" onClick={() => adjustCoeff('p', i, 1)} disabled={displayStatus==='correct' || (customLogic && customLogic.locked)}><i className="fa-solid fa-chevron-up pointer-events-none"></i></button>
                                                        <div className={`coeff-box w-10 h-12 md:w-12 md:h-14 rounded-lg md:rounded-xl flex items-center justify-center text-xl md:text-2xl font-bold ${coeffs.p[i] > 1 ? 'active' : ''}`}>
                                                            {coeffs.p[i]}
                                                        </div>
                                                        <button id={`btn-down-p-${i}`} className="btn-control !py-1 !px-2 md:!py-1 md:!px-3" onClick={() => adjustCoeff('p', i, -1)} disabled={displayStatus==='correct' || (customLogic && customLogic.locked)}><i className="fa-solid fa-chevron-down pointer-events-none"></i></button>
                                                    </div>
                                                    <div className="text-2xl md:text-3xl font-medium flex items-baseline gap-1">
                                                        {formatFormula(mol.f)} 
                                                        {showStateSymbols && <span className="text-sm text-slate-500 font-light ml-1">({mol.s})</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            {i < equation.products.length - 1 && <div className="text-slate-500 text-3xl mx-1 md:mx-2 self-center mt-2">+</div>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </ScaleToFit>
                        </div>
                    </div>

                    {/* Box 3: กล่องโมเดลอนุภาค */}
                    {showParticles && (
                        <div className="glass-dark w-full p-6 md:p-10 rounded-2xl flex flex-col border border-slate-700/50 shadow-[0_0_20px_rgba(59,130,246,0.1)] animate-fade-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-blue-500 opacity-50"></div>
                            <div className="text-blue-400 text-base font-semibold flex items-center justify-center md:justify-start border-b border-slate-700/50 pb-4 mb-4">
                                <i className="fa-solid fa-circle-nodes mr-2 text-lg"></i>ภาพจำลองโมเดลอนุภาค (Particle Model)
                            </div>
                            {renderParticleEquation()}
                        </div>
                    )}

                    {/* Box 4: Atom Counter Table */}
                    <div className="glass-dark w-full max-w-lg p-6 rounded-xl border border-slate-700/50 shadow-md">
                        <table className="w-full text-center">
                            <thead>
                                <tr className="border-b border-slate-700 text-slate-400 text-sm">
                                    <th className="pb-2 w-1/3">ธาตุ</th>
                                    <th className="pb-2 w-1/3">ซ้าย (สารตั้งต้น)</th>
                                    <th className="pb-2 w-1/3">ขวา (ผลิตภัณฑ์)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {allAtoms.map(atom => {
                                    const r = rCounts[atom] || 0;
                                    const p = pCounts[atom] || 0;
                                    const isBalanced = r === p;
                                    const colorClass = isBalanced ? 'text-green-400 font-bold' : 'text-slate-200 font-bold';
                                    const c = getAtomColor(atom);
                                    
                                    return (
                                        <tr key={atom} className="border-b border-slate-800/50">
                                            <td className="py-2 text-lg font-medium">
                                                <div className="flex items-center justify-start w-20 mx-auto">
                                                    <div 
                                                        className="w-4 h-4 rounded-full mr-3 shrink-0 shadow-[0_1px_3px_rgba(0,0,0,0.5)] border border-slate-700 relative overflow-hidden" 
                                                        style={{background: `radial-gradient(circle at 30% 30%, ${c.light}, ${c.dark})`}}
                                                    >
                                                        <div className="absolute top-[2px] left-[2px] w-[5px] h-[3px] bg-white rounded-full opacity-60 rotate-[-40deg]"></div>
                                                    </div>
                                                    <span className="text-left w-8 font-semibold">{atom}</span>
                                                </div>
                                            </td>
                                            <td className={`py-2 text-xl ${colorClass}`}>
                                                {isBalanced && <i className="fa-solid fa-check text-sm mr-2 text-green-500"></i>}
                                                {r}
                                            </td>
                                            <td className={`py-2 text-xl ${colorClass}`}>
                                                {isBalanced && <i className="fa-solid fa-check text-sm mr-2 text-green-500"></i>}
                                                {p}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Action Area */}
                    <div className="min-h-[120px] flex flex-col items-center justify-start w-full max-w-2xl text-center">
                        
                        {hint && displayStatus !== 'correct' && !isTutorial && (
                            <div className={`border px-4 py-3 rounded-xl mb-4 animate-pop w-full ${displayStatus === 'incorrect' ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-blue-500/10 border-blue-500/30 text-blue-300'}`}>
                                <i className={`fa-solid ${displayStatus === 'incorrect' ? 'fa-circle-exclamation' : 'fa-lightbulb'} mr-2`}></i>
                                {hint}
                            </div>
                        )}
                        
                        {displayStatus === 'correct' ? (
                            <div className="flex flex-col items-center w-full animate-pop">
                                <p className="text-green-400 text-lg mb-3 font-bold"><i className="fa-solid fa-check-circle mr-1"></i> ยอดเยี่ยม! ดุลสมการถูกต้องแล้ว</p>
                                
                                {equation.fact && !isTutorial && (
                                    <div className="bg-blue-500/10 border border-blue-500/30 text-blue-200 px-5 py-4 rounded-xl mb-6 text-sm w-full text-left shadow-lg">
                                        <p className="font-bold text-blue-400 mb-1"><i className="fa-solid fa-lightbulb mr-2"></i>เกร็ดความรู้:</p>
                                        {equation.fact}
                                    </div>
                                )}

                                {(!customLogic || !customLogic.hideNextButton) && (
                                    <button onClick={() => { Sound.click(soundEnabled); if(onNext) onNext(); }} className="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-full font-bold shadow-[0_0_15px_rgba(34,197,94,0.4)] transition-all transform hover:scale-105">
                                        ไปข้อถัดไป <i className="fa-solid fa-arrow-right ml-2"></i>
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="flex flex-wrap gap-4 justify-center items-center mt-2 relative z-[5]">
                                {!isTutorial && (
                                    <button onClick={generateHint} className="px-6 py-2.5 rounded-full font-semibold bg-blue-900/30 text-blue-400 border border-blue-500/50 hover:bg-blue-800/50 transition-colors shadow-lg">
                                        <i className="fa-solid fa-lightbulb mr-2"></i>คำใบ้
                                    </button>
                                )}
                                
                                <button 
                                    id="btn-check-answer"
                                    onClick={handleVerify} 
                                    className={`px-10 py-3 rounded-full font-bold text-lg transition-all border shadow-lg ${displayStatus === 'incorrect' ? 'bg-red-900/40 border-red-500/50 text-red-200' : 'bg-orange-600 hover:bg-orange-500 text-white border-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.3)]'}`}
                                >
                                    ตรวจสอบคำตอบ
                                </button>
                                
                                {!isTutorial && (
                                    <button onClick={handleSkip} className="px-6 py-2.5 rounded-full font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 hover:text-white transition-colors shadow-lg">
                                        ข้าม <i className="fa-solid fa-forward-step ml-2"></i>
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Pop-up เฉลย */}
                    {showAnswerPopup && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="glass w-full max-w-3xl p-6 md:p-8 rounded-3xl flex flex-col items-center text-center shadow-[0_0_30px_rgba(249,115,22,0.2)] border border-orange-500/30">
                                <i className="fa-solid fa-book-open text-5xl text-orange-400 mb-4"></i>
                                <h3 className="text-2xl font-bold text-white mb-2">เฉลยสมการ</h3>
                                <p className="text-slate-300 mb-6">เพื่อความเข้าใจที่ถูกต้อง นี่คือตัวเลขการดุลสมการที่สมบูรณ์ครับ</p>
                                
                                <div className="glass-dark p-5 md:p-6 rounded-2xl w-full flex justify-center items-center mb-8">
                                    <ScaleToFit>
                                        <div className="flex items-center text-2xl md:text-3xl font-medium gap-1 px-2">
                                            {equation.reactants.map((mol, i) => (
                                                <React.Fragment key={`ans-r-${i}`}>
                                                    <div className="flex items-baseline">
                                                        {equation.ans.r[i] > 1 && <span className="text-orange-500 mr-2 font-bold">{equation.ans.r[i]}</span>}
                                                        <span>{formatFormula(mol.f)}</span>
                                                        {showStateSymbols && <span className="text-sm text-slate-400 ml-1">({mol.s})</span>}
                                                    </div>
                                                    {i < equation.reactants.length - 1 && <span className="mx-3 text-slate-500 font-bold">+</span>}
                                                </React.Fragment>
                                            ))}
                                            <span className="mx-4 md:mx-6 text-orange-500 font-bold">→</span>
                                            {equation.products.map((mol, i) => (
                                                <React.Fragment key={`ans-p-${i}`}>
                                                    <div className="flex items-baseline">
                                                        {equation.ans.p[i] > 1 && <span className="text-orange-500 mr-2 font-bold">{equation.ans.p[i]}</span>}
                                                        <span>{formatFormula(mol.f)}</span>
                                                        {showStateSymbols && <span className="text-sm text-slate-400 ml-1">({mol.s})</span>}
                                                    </div>
                                                    {i < equation.products.length - 1 && <span className="mx-3 text-slate-500 font-bold">+</span>}
                                                </React.Fragment>
                                            ))}
                                        </div>
                                    </ScaleToFit>
                                </div>

                                <button onClick={closePopupAndNext} className="bg-orange-600 hover:bg-orange-500 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-transform transform hover:scale-105 mt-2">
                                    เข้าใจแล้ว ไปข้อถัดไป <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- NEW COMPONENT: Tutorial Overlay Mask ---
        const TutorialOverlay = ({ step, isVisible, onConfirm, soundEnabled }) => {
            const [rect, setRect] = useState(null);

            useEffect(() => {
                if (!step || !isVisible) return;
                
                const updateRect = () => {
                    const el = document.getElementById(step.targetId);
                    if (el) {
                        setRect(el.getBoundingClientRect());
                    } else {
                        setRect({ top: window.innerHeight/2, left: window.innerWidth/2, width: 0, height: 0, bottom: window.innerHeight/2, right: window.innerWidth/2 });
                    }
                };
                
                updateRect();
                
                const el = document.getElementById(step.targetId);
                if (el) {
                    const y = el.getBoundingClientRect().top + window.scrollY - 150;
                    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
                }

                window.addEventListener('resize', updateRect);
                window.addEventListener('scroll', updateRect, true);
                const intervalId = setInterval(updateRect, 100); 
                
                return () => {
                    window.removeEventListener('resize', updateRect);
                    window.removeEventListener('scroll', updateRect, true);
                    clearInterval(intervalId);
                };
            }, [step, isVisible]);

            if (!step || !isVisible || !rect) return null;

            const pad = 4; 
            const top = rect.top - pad;
            const left = rect.left - pad;
            const right = rect.right + pad;
            const bottom = rect.bottom + pad;
            const width = rect.width + (pad*2);
            const height = rect.height + (pad*2);
            
            const wWidth = window.innerWidth;
            const wHeight = window.innerHeight;

            return (
                <div className="fixed inset-0 z-[100] pointer-events-none">
                    <div className="absolute bg-slate-900/85 pointer-events-auto transition-all duration-300" style={{ top: 0, left: 0, width: '100%', height: Math.max(0, top) }} />
                    <div className="absolute bg-slate-900/85 pointer-events-auto transition-all duration-300" style={{ top: Math.min(wHeight, bottom), left: 0, width: '100%', height: Math.max(0, wHeight - bottom) }} />
                    <div className="absolute bg-slate-900/85 pointer-events-auto transition-all duration-300" style={{ top: Math.max(0, top), left: 0, width: Math.max(0, left), height }} />
                    <div className="absolute bg-slate-900/85 pointer-events-auto transition-all duration-300" style={{ top: Math.max(0, top), left: Math.min(wWidth, right), width: Math.max(0, wWidth - right), height }} />
                    
                    <div className="absolute border-2 border-orange-400 rounded-xl shadow-[0_0_20px_rgba(249,115,22,0.8)] animate-pulse transition-all duration-300 pointer-events-none" 
                         style={{ top, left, width, height }} />

                    {step.showHand && (
                        <div className="absolute pointer-events-none flex flex-col items-center animate-bounce transition-all duration-300 z-[105]"
                             style={{ top: bottom + 5, left: left + width/2 - 20 }}>
                            <i className="fa-solid fa-hand-pointer text-5xl text-orange-400 drop-shadow-[0_4px_10px_rgba(0,0,0,0.5)] -rotate-12"></i>
                        </div>
                    )}

                    <div className="absolute pointer-events-auto glass-dark border-2 border-blue-500/80 px-4 py-3 md:px-6 md:py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] max-w-2xl w-[90vw] transition-all duration-300 z-[105] flex flex-col items-center gap-3 md:gap-4"
                         style={{ 
                             top: bottom + 50 + 120 < wHeight ? bottom + 50 : Math.max(10, top - 140),
                             left: '50%',
                             transform: 'translateX(-50%)'
                         }}>
                         <div className="flex items-center gap-3 w-full">
                             <div className="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl shrink-0 shadow-inner ring-4 ring-blue-500/30">
                                 {step.id}
                             </div>
                             <div className="flex-1 w-full overflow-hidden flex items-center">
                                 <ScaleToFit className="justify-start w-full">
                                     <p className="text-white text-base md:text-lg font-medium drop-shadow-md pb-1 whitespace-nowrap">
                                         {step.text}
                                     </p>
                                 </ScaleToFit>
                             </div>
                         </div>
                         <button 
                             onClick={() => { Sound.click(soundEnabled); onConfirm(); }} 
                             className="bg-orange-600 hover:bg-orange-500 text-white px-8 py-2 rounded-xl font-bold whitespace-nowrap shadow-lg transition-transform transform hover:scale-105 animate-pulse shrink-0 text-base w-full md:w-auto"
                         >
                             เข้าใจแล้ว <i className="fa-solid fa-arrow-right ml-1"></i>
                         </button>
                    </div>
                </div>
            );
        };

        // --- TABS ---
        const HomeTab = () => (
            <div className="w-full max-w-3xl mx-auto animate-fade-in flex flex-col space-y-6">
                
                <div className="glass p-8 md:p-10 rounded-3xl text-center shadow-lg border border-slate-700/50 relative overflow-hidden">
                    <div className="absolute -top-10 -right-10 opacity-10 text-9xl">🧪</div>
                    <h1 className="text-3xl md:text-4xl font-extrabold text-orange-400 mb-6 drop-shadow-sm">หลักการดุลสมการเคมี</h1>
                    <p className="text-slate-200 text-[1.15rem] leading-loose">
                        สมการเคมีแสดงการเปลี่ยนแปลงจาก <b>สารตั้งต้น (Reactants)</b> ไปเป็น <b>ผลิตภัณฑ์ (Products)</b> โดยจำนวนอะตอมของธาตุแต่ละชนิดฝั่งซ้ายและขวาจะต้องสมดุลกันเสมอ
                    </p>
                </div>
                
                <div className="glass-dark p-6 md:p-8 rounded-2xl border-l-4 border-blue-500 shadow-md flex items-start gap-4">
                    <div className="bg-blue-900/50 w-12 h-12 rounded-full flex items-center justify-center shrink-0 mt-1">
                        <i className="fa-solid fa-scale-balanced text-2xl text-blue-400"></i>
                    </div>
                    <div>
                        <h3 className="text-xl font-bold text-white mb-2">กฎทรงมวล (Law of Conservation of Mass)</h3>
                        <p className="text-slate-300 leading-relaxed text-[1.05rem]">
                            มวลรวมของสารก่อนเกิดปฏิกิริยาจะต้องเท่ากับมวลรวมของสารหลังเกิดปฏิกิริยาเสมอ 
                            ดังนั้น <span className="text-orange-400 font-bold mx-1">จำนวนอะตอมของแต่ละธาตุ ก่อนและหลังทำปฏิกิริยา จะต้องเท่ากัน</span>
                        </p>
                    </div>
                </div>

                <div className="bg-slate-800/60 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-inner">
                    <h4 className="text-yellow-400 font-bold text-xl mb-4 flex items-center">
                        <i className="fa-solid fa-lightbulb mr-3"></i> เคล็ดลับการนับจำนวนอะตอม
                    </h4>
                    <p className="text-slate-200 leading-relaxed text-[1.05rem] mb-4">
                        ในการนับจำนวนอะตอม ให้พิจารณาผลคูณระหว่าง <b>"ตัวเลขสัมประสิทธิ์ (ด้านหน้า)"</b> และ <b>"ตัวเลขห้อย"</b> ของธาตุนั้นๆ
                    </p>
                    <div className="bg-slate-900 p-5 rounded-xl border border-slate-700/80">
                        <p className="text-slate-400 mb-3 text-sm">พิจารณาตัวอย่างต่อไปนี้:</p>
                        <div className="text-center text-2xl mb-4 font-medium tracking-wide">
                            <span className="text-orange-400 font-bold">3</span>H<sub className="text-yellow-400 font-bold">2</sub>O
                        </div>
                        <ul className="space-y-2 text-[1.05rem] text-slate-300 list-disc list-inside ml-2">
                            <li><b>ธาตุไฮโดรเจน (H)</b> มีจำนวน <span className="text-orange-400">3</span> × <span className="text-yellow-400">2</span> = <b>6 อะตอม</b></li>
                            <li><b>ธาตุออกซิเจน (O)</b> มีจำนวน <span className="text-orange-400">3</span> × 1 = <b>3 อะตอม</b> <span className="text-slate-400 text-sm">(หากไม่ปรากฏตัวเลขห้อย ถือว่ามีค่าเท่ากับ 1)</span></li>
                        </ul>
                    </div>
                </div>

                <div className="glass p-6 md:p-8 rounded-2xl border border-slate-700/50 shadow-lg">
                    <h3 className="text-xl font-bold text-white mb-5 flex items-center">
                        <i className="fa-solid fa-list-ol text-green-400 mr-3"></i> หลักการดุลสมการเคมีตามลำดับขั้นตอนเชิงวิทยาศาสตร์
                    </h3>
                    <div className="space-y-4 text-[1.05rem] text-slate-300 leading-relaxed">
                        <div className="flex gap-3">
                            <span className="text-green-400 font-bold">1.</span>
                            <div>
                                <b>พิจารณาสารประกอบที่ซับซ้อนที่สุดก่อน:</b> เริ่มดุลสมการจากโมเลกุลที่มีจำนวนอะตอมหรือชนิดธาตุมากที่สุด (เช่น ธาตุโลหะ หรือไอออนกลุ่ม) โดยหลีกเลี่ยงธาตุที่ปรากฏในสารหลายชนิดในตอนเริ่มต้น
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <span className="text-green-400 font-bold">2.</span>
                            <div>
                                <b>ดุลธาตุอโลหะและธาตุองค์ประกอบอื่นๆ:</b> ทำการปรับสัมประสิทธิ์จำนวนโมล (ด้านหน้า) เพื่อให้จำนวนอะตอมของธาตุที่เหลือในสารตั้งต้นและผลิตภัณฑ์มีความสมดุลตามกฎทรงมวล
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <span className="text-green-400 font-bold">3.</span>
                            <div>
                                <b>ดุลธาตุไฮโดรเจน (H) และออกซิเจน (O) ในขั้นสุดท้าย:</b> เนื่องจาก H และ O มักเป็นองค์ประกอบของสารหลายชนิด การดุลในภายหลังจะช่วยลดความซ้ำซ้อนและลดข้อผิดพลาดในการคำนวณ
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-6 bg-red-900/20 border border-red-500/30 p-4 rounded-xl flex items-start gap-3">
                        <i className="fa-solid fa-triangle-exclamation text-red-400 mt-1"></i>
                        <p className="text-red-200 text-[0.95rem] leading-relaxed">
                            <b>ข้อควรระวัง:</b> ในการดุลสมการเคมี สามารถเปลี่ยนแปลงได้เฉพาะ <b>"ตัวเลขสัมประสิทธิ์ด้านหน้า"</b> เท่านั้น ห้ามเปลี่ยนแปลงตัวเลขห้อยของสูตรเคมีโดยเด็ดขาด เนื่องจากจะทำให้ชนิดของสารเปลี่ยนไป
                        </p>
                    </div>
                </div>

            </div>
        );

        const StepByStepTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [currentStepIndex, setCurrentStepIndex] = useState(0);
            const [status, setStatus] = useState('idle');
            const [isOverlayVisible, setIsOverlayVisible] = useState(true);
            
            const tutorialSteps = useMemo(() => [
                { id: 1, targetId: 'eq-display', text: "ยินดีต้อนรับ! เป้าหมายคือปรับเลขสัมประสิทธิ์เพื่อให้จำนวนอะตอมสมดุลกัน", requiresAction: false },
                { id: 2, targetId: 'btn-up-p-0', text: "ขั้นที่ 1: ดุล (C) ฝั่งซ้าย C=3 ให้กดปุ่มปรับเลขหน้า CO₂ เป็น 3", requiresAction: true, condition: (c) => c.p[0] === 3, showHand: true },
                { id: 3, targetId: 'btn-up-p-1', text: "ขั้นที่ 2: ดุล (H) ฝั่งซ้าย H=8 ให้กดปุ่มปรับเลขหน้า H₂O เป็น 4", requiresAction: true, condition: (c) => c.p[0] === 3 && c.p[1] === 4, showHand: true },
                { id: 4, targetId: 'btn-up-r-1', text: "ขั้นที่ 3: ดุล (O) ฝั่งขวา O=10 ให้กดปุ่มปรับเลขหน้า O₂ เป็น 5", requiresAction: true, condition: (c) => c.p[0] === 3 && c.p[1] === 4 && c.r[1] === 5, showHand: true },
                { id: 5, targetId: 'btn-check-answer', text: "ยอดเยี่ยม! อะตอมสมดุลแล้ว กดปุ่ม 'ตรวจสอบคำตอบ' เพื่อยืนยัน", requiresAction: true, condition: (c, s) => s === 'correct', showHand: true },
                { id: 6, targetId: 'eq-display', text: "🎉 ภารกิจสำเร็จ! คุณผ่านการทดสอบหลักสูตรดุลสมการเคมีเบื้องต้นแล้ว", requiresAction: false }
            ], []);

            const propaneEq = db.find(c => c.category === "การเผาไหม้").equations.find(e => e.id === "cb2");
            const [tutorialCoeffs, setTutorialCoeffs] = useState({ r: [1, 1], p: [1, 1] });

            const handleOverlayConfirm = () => {
                Sound.click(soundEnabled);
                const step = tutorialSteps[currentStepIndex];
                
                if (step.requiresAction) {
                    setIsOverlayVisible(false);
                } else {
                    if (currentStepIndex < tutorialSteps.length - 1) {
                        setCurrentStepIndex(s => s + 1);
                    } else {
                        setIsOverlayVisible(false);
                    }
                }
            };

            useEffect(() => {
                const step = tutorialSteps[currentStepIndex];
                if (step && step.requiresAction && !isOverlayVisible) {
                    if (step.condition(tutorialCoeffs, status)) {
                        Sound.success(soundEnabled);
                        if (currentStepIndex < tutorialSteps.length - 1) {
                            setCurrentStepIndex(s => s + 1);
                            setIsOverlayVisible(true);
                        }
                    }
                }
            }, [tutorialCoeffs, status, currentStepIndex, isOverlayVisible, tutorialSteps, soundEnabled]);

            const handleVerify = (currentCoeffs) => {
                const isCorrect = currentCoeffs.r[1] === 5 && currentCoeffs.p[0] === 3 && currentCoeffs.p[1] === 4;
                if (isCorrect) {
                    setStatus('correct');
                } else {
                    setStatus('incorrect');
                }
            };

            const isCompleted = currentStepIndex >= tutorialSteps.length - 1 && !isOverlayVisible;

            return (
                <div className="w-full flex flex-col items-center animate-fade-in relative">
                    
                    <TutorialOverlay 
                        step={tutorialSteps[currentStepIndex]} 
                        isVisible={isOverlayVisible}
                        onConfirm={handleOverlayConfirm}
                        soundEnabled={soundEnabled}
                    />

                    <div className="mb-6 text-center z-10">
                        <h2 className="text-2xl font-bold text-white mb-2">เรียนรู้ทีละขั้น: การเผาไหม้ก๊าซโพรเพน</h2>
                        <p className="text-slate-400">
                            {isOverlayVisible ? "อ่านภารกิจแล้วกดเข้าใจแล้วเพื่อลงมือทำ" : "กำลังทำภารกิจ..."}
                        </p>
                    </div>

                    {!isOverlayVisible && currentStepIndex > 0 && currentStepIndex < tutorialSteps.length - 1 && (
                        <div className="bg-blue-900/30 border border-blue-500 text-blue-200 px-6 py-3 rounded-xl mb-6 shadow-[0_0_15px_rgba(59,130,246,0.3)] animate-pulse text-center max-w-lg w-full z-10 flex items-center justify-center gap-3">
                            <i className="fa-solid fa-bell text-yellow-400 text-xl"></i>
                            <span className="font-medium text-lg text-left">
                                {tutorialSteps[currentStepIndex].text.replace(/^ขั้นที่ \d: /g, '')}
                            </span>
                        </div>
                    )}

                    <div className="w-full">
                        <EquationSolver 
                            equation={propaneEq} 
                            hideHeader={true}
                            showStateSymbols={showStateSymbols}
                            showParticles={showParticles}
                            onToggleStateSymbols={onToggleStateSymbols}
                            onToggleParticles={onToggleParticles}
                            isTutorial={true}
                            soundEnabled={soundEnabled}
                            customLogic={{ overrideCoeffs: tutorialCoeffs, onChange: setTutorialCoeffs, onVerify: handleVerify, status: status, setStatus: setStatus, locked: false, hideNextButton: true }}
                        />
                    </div>

                    {isCompleted && status === 'correct' && (
                        <button onClick={() => { 
                            Sound.click(soundEnabled); 
                            setTutorialCoeffs({r:[1,1], p:[1,1]}); 
                            setStatus('idle'); 
                            setCurrentStepIndex(0);
                            setIsOverlayVisible(true); 
                            window.scrollTo({ top: 0, behavior: 'smooth' }); 
                        }} className="mt-4 px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-white shadow-lg z-10 relative">
                            <i className="fa-solid fa-rotate-right mr-2"></i> เริ่มทำใหม่อีกครั้ง
                        </button>
                    )}
                </div>
            );
        };

        const FreePlayTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [equation, setEquation] = useState(() => allEquations[Math.floor(Math.random() * allEquations.length)]);
            const [streak, setStreak] = useState(0);
            
            const loadRandom = () => {
                let next;
                do { next = allEquations[Math.floor(Math.random() * allEquations.length)]; } while (next.id === equation.id && allEquations.length > 1);
                setEquation(next);
            };

            return (
                <div className="w-full relative animate-fade-in">
                    <div className="flex justify-between items-center max-w-5xl mx-auto mb-6 px-4">
                        <div className="text-orange-500 font-medium text-lg"><i className="fa-solid fa-dice mr-2"></i>สุ่มโจทย์ท้าทาย</div>
                        <div className={`glass px-4 py-1.5 rounded-full flex items-center gap-2 font-bold transition-all ${streak > 0 ? 'text-orange-400 border-orange-500/50 shadow-[0_0_10px_rgba(249,115,22,0.3)] animate-pop' : 'text-slate-500 border-slate-700'}`}>
                            <i className="fa-solid fa-fire-flame-curved"></i> Combo: {streak}
                        </div>
                    </div>
                    <EquationSolver key={equation.id} equation={equation} showStateSymbols={showStateSymbols} showParticles={showParticles} onToggleStateSymbols={onToggleStateSymbols} onToggleParticles={onToggleParticles} soundEnabled={soundEnabled} onSuccessFirstTry={() => setStreak(s => s + 1)} onFail={() => setStreak(0)} onNext={loadRandom} />
                </div>
            );
        };

        const BankTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [catIdx, setCatIdx] = useState(0);
            const [eqIdx, setEqIdx] = useState(0);

            const category = db[catIdx];
            const isFinished = eqIdx >= category.equations.length;

            const handleNext = () => setEqIdx(i => i + 1);

            return (
                <div className="w-full max-w-5xl mx-auto animate-fade-in">
                    <div className="glass p-5 md:p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between mb-8 shadow-md max-w-4xl mx-auto">
                        <span className="text-slate-300 font-medium text-lg mb-3 md:mb-0">
                            <i className="fa-solid fa-layer-group mr-2 text-orange-400"></i>เลือกหมวดหมู่ปฏิกิริยา:
                        </span>
                        <div className="relative w-full md:w-64">
                            <select 
                                className="w-full appearance-none bg-[#1e293b] border border-slate-600 text-white px-5 py-3 rounded-xl outline-none focus:border-orange-500 cursor-pointer transition-all shadow-sm text-base font-medium"
                                value={catIdx} onChange={(e) => { Sound.click(soundEnabled); setCatIdx(Number(e.target.value)); setEqIdx(0); }}
                            >
                                {db.map((cat, i) => <option key={i} value={i} className="bg-slate-800">{cat.category}</option>)}
                            </select>
                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-300">
                                <i className="fa-solid fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>

                    {isFinished ? (
                        <div className="text-center mt-20 animate-fade-in glass p-12 rounded-3xl border border-green-500/30 max-w-4xl mx-auto">
                            <i className="fa-solid fa-medal text-6xl text-yellow-400 mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]"></i>
                            <h2 className="text-3xl font-bold mb-2">ยินดีด้วย ผู้พิทักษ์กฎทรงมวล!</h2>
                            <p className="text-slate-300 mb-6 text-lg">คุณทำโจทย์หมวด "{category.category}" สำเร็จครบทุกข้อแล้วครับ</p>
                            <button onClick={() => { Sound.click(soundEnabled); setEqIdx(0); }} className="px-8 py-3 bg-[#1e293b] border border-slate-600 rounded-xl hover:bg-slate-700 transition-colors shadow-lg font-bold">
                                <i className="fa-solid fa-rotate-left mr-2"></i> ทำหมวดนี้อีกครั้ง
                            </button>
                        </div>
                    ) : (
                        <div>
                            <div className="text-center text-slate-400 mb-4 font-medium text-lg">ข้อที่ <span className="text-orange-400">{eqIdx + 1}</span> / {category.equations.length}</div>
                            <EquationSolver key={`${catIdx}-${eqIdx}`} equation={{...category.equations[eqIdx], categoryName: category.category}} showStateSymbols={showStateSymbols} showParticles={showParticles} onToggleStateSymbols={onToggleStateSymbols} onToggleParticles={onToggleParticles} soundEnabled={soundEnabled} onNext={handleNext} />
                        </div>
                    )}
                </div>
            );
        };

        // 3. Main App Container
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [showStateSymbols, setShowStateSymbols] = useState(true);
            const [showParticles, setShowParticles] = useState(false);
            const [soundEnabled, setSoundEnabled] = useState(true);

            const handleTabSwitch = (tab) => {
                Sound.click(soundEnabled);
                setActiveTab(tab);
            };

            const renderTab = () => {
                const props = { 
                    showStateSymbols, 
                    onToggleStateSymbols: () => { Sound.click(soundEnabled); setShowStateSymbols(!showStateSymbols); },
                    showParticles, 
                    onToggleParticles: () => { Sound.click(soundEnabled); setShowParticles(!showParticles); },
                    soundEnabled
                };
                switch(activeTab) {
                    case 'home': return <HomeTab />;
                    case 'step': return <StepByStepTab {...props} />;
                    case 'free': return <FreePlayTab {...props} />;
                    case 'bank': return <BankTab {...props} />;
                    default: return <HomeTab />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8">
                    <nav className="w-full max-w-6xl mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6 glass px-6 md:px-8 py-4 rounded-2xl relative z-[120]">
                        <div className="text-2xl font-bold tracking-wider text-white drop-shadow-md">
                            Phatthana <span className="text-orange-500">Lab</span>
                        </div>
                        <div className="flex flex-wrap justify-center items-center gap-4 md:gap-8 text-sm md:text-[1.05rem] font-medium">
                            <button onClick={() => handleTabSwitch('home')} className={`pb-1 border-b-2 transition-colors ${activeTab === 'home' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>หน้าแรก</button>
                            <button onClick={() => handleTabSwitch('step')} className={`pb-1 border-b-2 transition-colors ${activeTab === 'step' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>เรียนทีละขั้น</button>
                            <button onClick={() => handleTabSwitch('free')} className={`pb-1 border-b-2 transition-colors ${activeTab === 'free' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>เล่นอิสระ</button>
                            <button onClick={() => handleTabSwitch('bank')} className={`pb-1 border-b-2 transition-colors ${activeTab === 'bank' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>คลังโจทย์</button>
                            
                            <div className="h-6 w-px bg-slate-700 mx-2 hidden md:block"></div>
                            <button 
                                onClick={() => { Sound.click(!soundEnabled); setSoundEnabled(!soundEnabled); }} 
                                className={`flex items-center justify-center w-9 h-9 rounded-full transition-all ${soundEnabled ? 'text-green-400 bg-slate-800 hover:bg-slate-700' : 'text-slate-500 bg-slate-800/50 hover:bg-slate-800'}`}
                                title={soundEnabled ? "ปิดเสียง" : "เปิดเสียง"}
                            >
                                <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                            </button>
                        </div>
                    </nav>
                    <main className="flex-grow w-full overflow-x-hidden">
                        {renderTab()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
