                            <p className="text-slate-200 leading-relaxed text-base mb-4">
                                จำนวนอะตอมของแต่ละธาตุ คำนวณได้จากการนำ <b className="text-orange-400">เลขสัมประสิทธิ์ (ตัวเลขข้างหน้า)</b> คูณกับ <b className="text-yellow-400">ตัวเลขห้อยท้ายธาตุ</b>
                            </p>
                            <ul className="space-y-2 text-base text-slate-300 list-disc list-inside">
                                <li><b>ธาตุไฮโดรเจน (H)</b> มีจำนวน <span className="text-orange-400 font-bold">2</span> × <span className="text-yellow-400 font-bold">2</span> = <b>4 อะตอม</b></li>
                                <li><b>ธาตุออกซิเจน (O)</b> มีจำนวน <span className="text-orange-400 font-bold">2</span> × <b>1</b> = <b>2 อะตอม</b> <span className="text-slate-400 text-sm">(ธาตุที่ไม่มีเลขห้อย มีค่าเท่ากับ 1)</span></li>
                            </ul>
                        </div>

                        <div className="bg-slate-900/90 p-5 rounded-2xl border border-slate-700 flex flex-col items-center justify-center shrink-0 min-w-[210px]">
                            <div className="text-2xl font-bold tracking-wider mb-2">
                                <span className="text-orange-400">2</span>H<sub className="text-yellow-400">2</sub>O
                            </div>
                            <div className="flex items-center justify-center gap-1">
                                <MoleculeSVG formula="H2O" atomsObj={{H:2, O:1}} />
                                <MoleculeSVG formula="H2O" atomsObj={{H:2, O:1}} />
                            </div>
                            <span className="text-xs text-slate-400 mt-1">น้ำ (H₂O) จำนวน 2 โมเลกุล</span>
                        </div>
                    </div>
                </div>

                {/* ลำดับขั้นตอนการดุลสมการ */}
                <div className="glass p-6 md:p-8 rounded-2xl border border-slate-700/50 shadow-lg relative overflow-hidden">
                    <i className="fa-solid fa-diagram-project absolute right-6 top-6 text-7xl text-green-500/5 pointer-events-none"></i>
                    <h3 className="text-xl font-bold text-white mb-5 flex items-center">
                        <i className="fa-solid fa-list-check text-green-400 mr-3"></i> ขั้นตอนการดุลสมการเคมี
                    </h3>
                    <div className="space-y-4 text-base text-slate-300 leading-relaxed">
                        <div className="flex gap-3 items-start bg-slate-900/40 p-3.5 rounded-xl border border-slate-800">
                            <span className="bg-green-500/20 text-green-400 font-bold w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5">1</span>
                            <div>
                                <b className="text-white">ดุลธาตุในสารประกอบที่มีอะตอมมากก่อน:</b> เริ่มสังเกตและปรับเลขสัมประสิทธิ์หน้าสารประกอบที่มีจำนวนอะตอมมาก เช่น ธาตุโลหะ หรือธาตุที่ปรากฏเพียงแห่งเดียวในแต่ละฝั่งของสมการ
                            </div>
                        </div>
                        <div className="flex gap-3 items-start bg-slate-900/40 p-3.5 rounded-xl border border-slate-800">
                            <span className="bg-green-500/20 text-green-400 font-bold w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5">2</span>
                            <div>
                                <b className="text-white">ดุลธาตุอโลหะอื่นๆ:</b> ปรับเลขสัมประสิทธิ์ด้านหน้าสาร เพื่อทำให้จำนวนอะตอมของธาตุอื่นๆ เท่ากันทั้งฝั่งสารตั้งต้นและผลิตภัณฑ์
                            </div>
                        </div>
                        <div className="flex gap-3 items-start bg-slate-900/40 p-3.5 rounded-xl border border-slate-800">
                            <span className="bg-green-500/20 text-green-400 font-bold w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5">3</span>
                            <div>
                                <b className="text-white">ดุลธาตุไฮโดรเจน (H) และออกซิเจน (O) เป็นลำดับสุดท้าย:</b> เนื่องจากธาตุทั้งสองชนิดมักอยู่ในสารประกอบหลายตัว และตรวจนับจำนวนอะตอมรวมทั้งสองฝั่งอีกครั้งเพื่อความถูกต้อง
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-6 bg-red-900/20 border border-red-500/30 p-4 rounded-xl flex items-start gap-3">
                        <i className="fa-solid fa-triangle-exclamation text-red-400 mt-1 text-lg"></i>
                        <p className="text-red-200 text-sm md:text-base leading-relaxed">
                            <b>ข้อควรจำ:</b> การดุลสมการเคมีสามารถเติมหรือเปลี่ยนได้เฉพาะ <b>"ตัวเลขสัมประสิทธิ์ข้างหน้าสูตรเคมี"</b> เท่านั้น ห้ามเปลี่ยนตัวเลขห้อยท้ายธาตุโดยเด็ดขาด เพราะจะทำให้สูตรเคมีและชนิดของสารเปลี่ยนไป
                        </p>
                    </div>
                </div>

            </div>
        );

        // โหมดเรียนทีละขั้น
        const StepByStepTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [currentStepIndex, setCurrentStepIndex] = useState(0);
            const [status, setStatus] = useState('idle');
            const [isOverlayVisible, setIsOverlayVisible] = useState(true);
            
            const tutorialSteps = useMemo(() => [
                { type: 'ui', badgeIcon: 'fa-flask', targetId: 'eq-display', text: "แถบสมการด้านบน: ใช้แสดงสมการเคมีปัจจุบันและสถานะว่าสมดุลหรือยัง", requiresAction: false, btnText: "ถัดไป" },
                { type: 'ui', badgeIcon: 'fa-circle-nodes', targetId: 'btn-toggle-particles', text: "ปุ่มเปิดโมเดลอนุภาค: ใช้แสดงภาพจำลองโมเลกุล ช่วยให้เห็นภาพการจับคู่อะตอม", requiresAction: false, btnText: "ถัดไป" },
                { type: 'ui', badgeIcon: 'fa-eye', targetId: 'btn-toggle-states', text: "ปุ่มสถานะสาร: ใช้สำหรับเปิดหรือซ่อนสัญลักษณ์สถานะของสารในสมการ", requiresAction: false, btnText: "ถัดไป" },
                { type: 'ui', badgeIcon: 'fa-table', targetId: 'atom-counter-box', text: "ตารางนับอะตอม: คำนวณจำนวนอะตอมฝั่งซ้ายและขวาให้อัตโนมัติทันทีที่ปรับตัวเลข", requiresAction: false, btnText: "ถัดไป" },
                { type: 'ui', badgeIcon: 'fa-lightbulb', targetId: 'action-buttons-group', text: "แถบปุ่มตัวช่วย: มีปุ่ม 'คำใบ้' ช่วยแนะแนวทาง และปุ่ม 'ข้าม' สำหรับดูเฉลย", requiresAction: false, btnText: "ถัดไป" },
                
                { 
                    type: 'mascot', 
                    title: "พร้อมจะลุยกันหรือยัง?", 
                    text: "รู้จักเครื่องมือในห้องทดลองครบทุกชิ้นแล้ว ต่อไปเรามาลองฝึกดุลสมการการเผาไหม้แก๊สโพรเพน (C₃H₈) ไปพร้อมกันทีละขั้นเลยครับ!", 
                    requiresAction: false, 
                    btnText: "พร้อมแล้ว ลุยเลย!" 
                },

                { 
                    type: 'step', 
                    badgeNum: 1, 
                    targetId: 'btn-up-p-0', 
                    text: "ขั้นที่ 1: ดุลคาร์บอน (C) ให้กดลูกศรปรับเลขหน้า CO₂ เป็น 3", 
                    reason: "เพราะฝั่งซ้าย C₃H₈ มี C = 3 อะตอม แต่ฝั่งขวา CO₂ มี C = 1 อะตอม จึงต้องคูณ 3 หน้า CO₂ (3×1 = 3 อะตอม)",
                    requiresAction: true, 
                    condition: (c) => c.p[0] === 3, 
                    showHand: true, 
                    btnText: "ลงมือทำ" 
                },
                { 
                    type: 'step', 
                    badgeNum: 2, 
                    targetId: 'btn-up-p-1', 
                    text: "ขั้นที่ 2: ดุลไฮโดรเจน (H) ให้กดลูกศรปรับเลขหน้า H₂O เป็น 4", 
                    reason: "เพราะฝั่งซ้าย C₃H₈ มี H = 8 อะตอม แต่ฝั่งขวา H₂O มี H ห้อย 2 อยู่แล้ว จึงต้องใส่เลข 4 ข้างหน้า (4×2 = 8 อะตอม)",
                    requiresAction: true, 
                    condition: (c) => c.p[0] === 3 && c.p[1] === 4, 
                    showHand: true, 
                    btnText: "ลงมือทำ" 
                },
                { 
                    type: 'step', 
                    badgeNum: 3, 
                    targetId: 'btn-up-r-1', 
                    text: "ขั้นที่ 3: ดุลออกซิเจน (O) ให้กดลูกศรปรับเลขหน้า O₂ ฝั่งซ้ายเป็น 5", 
                    reason: "เพราะฝั่งขวามี O จาก 3CO₂ (3×2=6) รวมกับ 4H₂O (4×1=4) ได้ 10 อะตอม ฝั่งซ้ายเป็น O₂ จึงต้องคูณ 5 (5×2 = 10 อะตอม)",
                    requiresAction: true, 
                    condition: (c) => c.p[0] === 3 && c.p[1] === 4 && c.r[1] === 5, 
                    showHand: true, 
                    btnText: "ลงมือทำ" 
                },
                { 
                    type: 'step', 
                    badgeNum: 4, 
                    targetId: 'btn-check-answer', 
                    text: "ขั้นที่ 4: ดุลครบทุกธาตุแล้ว! กดปุ่ม 'ตรวจสอบคำตอบ' เพื่อยืนยันผลลัพธ์", 
                    reason: "สังเกตตารางนับอะตอม: C = 3, H = 8 และ O = 10 เท่ากันทั้งฝั่งซ้ายและขวาตามกฎทรงมวลแล้ว",
                    requiresAction: true, 
                    condition: (c, s) => s === 'correct', 
                    showHand: true, 
                    btnText: "ไปกดตรวจสอบ" 
                },
                { type: 'ui', badgeIcon: 'fa-trophy', targetId: 'eq-display', text: "🎉 ภารกิจสำเร็จ! คุณเข้าใจที่มาและการคำนวณดุลสมการเคมีครบทุกขั้นตอนแล้ว", requiresAction: false, btnText: "เสร็จสิ้น" }
            ], []);

            const propaneEq = db.find(c => c.category === "การเผาไหม้").equations.find(e => e.id === "cb2");
            const [tutorialCoeffs, setTutorialCoeffs] = useState({ r: [1, 1], p: [1, 1] });

            const handleOverlayConfirm = () => {
                Sound.click(soundEnabled);
                const step = tutorialSteps[currentStepIndex];
                
                if (step.requiresAction) {
                    setIsOverlayVisible(false);
                } else {
                    if (currentStepIndex < tutorialSteps.length - 1) {
                        setCurrentStepIndex(s => s + 1);
                    } else {
                        setIsOverlayVisible(false);
                    }
                }
            };

            useEffect(() => {
                const step = tutorialSteps[currentStepIndex];
                if (step && step.requiresAction && !isOverlayVisible) {
                    if (step.condition(tutorialCoeffs, status)) {
                        Sound.success(soundEnabled);
                        if (currentStepIndex < tutorialSteps.length - 1) {
                            setCurrentStepIndex(s => s + 1);
                            setIsOverlayVisible(true);
                        }
                    }
                }
            }, [tutorialCoeffs, status, currentStepIndex, isOverlayVisible, tutorialSteps, soundEnabled]);

            const handleVerify = (currentCoeffs) => {
                const isCorrect = currentCoeffs.r[1] === 5 && currentCoeffs.p[0] === 3 && currentCoeffs.p[1] === 4;
                if (isCorrect) {
                    setStatus('correct');
                } else {
                    setStatus('incorrect');
                }
            };

            const isCompleted = currentStepIndex >= tutorialSteps.length - 1 && !isOverlayVisible;
            const activeStep = tutorialSteps[currentStepIndex];

            return (
                <div className="w-full flex flex-col items-center animate-fade-in relative">
                    
                    <TutorialOverlay 
                        step={activeStep} 
                        isVisible={isOverlayVisible}
                        onConfirm={handleOverlayConfirm}
                        soundEnabled={soundEnabled}
                        equation={propaneEq}
                        coeffs={tutorialCoeffs}
                    />

                    <div className="mb-4 text-center z-10">
                        <h2 className="text-2xl font-bold text-white mb-1">เรียนรู้ทีละขั้น: แนะนำระบบ & การเผาไหม้แก๊สโพรเพน</h2>
                        <p className="text-slate-400 text-sm md:text-base">
                            {isOverlayVisible ? "อ่านคำอธิบายแล้วกดปุ่มเพื่อดำเนินการต่อ" : "กำลังปฏิบัติภารกิจ..."}
                        </p>
                    </div>

                    {!isOverlayVisible && activeStep && activeStep.requiresAction && (
                        <div className="bg-blue-950/80 border-2 border-blue-500 text-blue-100 px-5 py-3.5 rounded-2xl mb-6 shadow-[0_0_20px_rgba(59,130,246,0.35)] max-w-3xl w-full z-10 flex flex-col gap-1.5 overflow-hidden">
                            <div className="flex items-center gap-3 w-full">
                                <i className="fa-solid fa-bell text-yellow-400 text-xl animate-bounce shrink-0"></i>
                                <div className="flex-1 min-w-0 overflow-hidden">
                                    <ScaleToFit align="left">
                                        <span className="font-bold text-base md:text-lg text-white pr-2">
                                            {activeStep.text}
                                        </span>
                                    </ScaleToFit>
                                </div>
                            </div>
                            {activeStep.reason && (
                                <div className="w-full pl-8 overflow-hidden">
                                    <ScaleToFit align="left">
                                        <span className="text-xs md:text-sm text-blue-200 pr-2">
                                            เหตุผล: {activeStep.reason}
                                        </span>
                                    </ScaleToFit>
                                </div>
                            )}
                        </div>
                    )}

                    <div className="w-full">
                        <EquationSolver 
                            equation={propaneEq} 
                            hideHeader={true}
                            showStateSymbols={showStateSymbols}
                            showParticles={showParticles}
                            onToggleStateSymbols={onToggleStateSymbols}
                            onToggleParticles={onToggleParticles}
                            isTutorial={true}
                            soundEnabled={soundEnabled}
                            customLogic={{ overrideCoeffs: tutorialCoeffs, onChange: setTutorialCoeffs, onVerify: handleVerify, status: status, setStatus: setStatus, locked: false, hideNextButton: true }}
                        />
                    </div>

                    {isCompleted && status === 'correct' && (
                        <button onClick={() => { 
                            Sound.click(soundEnabled); 
                            setTutorialCoeffs({r:[1,1], p:[1,1]}); 
                            setStatus('idle'); 
                            setCurrentStepIndex(0);
                            setIsOverlayVisible(true); 
                            window.scrollTo({ top: 0, behavior: 'smooth' }); 
                        }} className="mt-4 px-6 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-white shadow-lg z-10 relative">
                            <i className="fa-solid fa-rotate-right mr-2"></i> เริ่มฝึกสอนใหม่อีกครั้ง
                        </button>
                    )}
                </div>
            );
        };

        // โหมดเล่นอิสระ: สุ่มจากทั้งคลังโจทย์หลักและโจทย์แจกแต้ม (1:1:1) ปะปนกัน
        const FreePlayTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [equation, setEquation] = useState(() => allFreePlayEquations[Math.floor(Math.random() * allFreePlayEquations.length)]);
            const [streak, setStreak] = useState(0);
            
            const loadRandom = () => {
                let next;
                do { next = allFreePlayEquations[Math.floor(Math.random() * allFreePlayEquations.length)]; } while (next.id === equation.id && allFreePlayEquations.length > 1);
                setEquation(next);
            };

            return (
                <div className="w-full relative animate-fade-in">
                    <div className="flex justify-between items-center max-w-5xl mx-auto mb-6 px-4">
                        <div className="text-orange-500 font-medium text-lg"><i className="fa-solid fa-dice mr-2"></i>สุ่มโจทย์ท้าทาย</div>
                        <div className={`glass px-4 py-1.5 rounded-full flex items-center gap-2 font-bold transition-all ${streak > 0 ? 'text-orange-400 border-orange-500/50 shadow-[0_0_10px_rgba(249,115,22,0.3)] animate-pop' : 'text-slate-500 border-slate-700'}`}>
                            <i className="fa-solid fa-fire-flame-curved"></i> Combo: {streak}
                        </div>
                    </div>
                    <EquationSolver key={equation.id} equation={equation} showStateSymbols={showStateSymbols} showParticles={showParticles} onToggleStateSymbols={onToggleStateSymbols} onToggleParticles={onToggleParticles} soundEnabled={soundEnabled} onSuccessFirstTry={() => setStreak(s => s + 1)} onFail={() => setStreak(0)} onNext={loadRandom} />
                </div>
            );
        };

        // โหมดคลังโจทย์: นำคำว่า (5 ข้อ) ออกจากตัวเลือกหมวดหมู่
        const BankTab = ({ showStateSymbols, onToggleStateSymbols, showParticles, onToggleParticles, soundEnabled }) => {
            const [catIdx, setCatIdx] = useState(0);
            const [eqIdx, setEqIdx] = useState(0);

            const category = db[catIdx];
            const isFinished = eqIdx >= category.equations.length;

            const handleNext = () => setEqIdx(i => i + 1);

            return (
                <div className="w-full max-w-5xl mx-auto animate-fade-in">
                    <div className="glass p-5 md:p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between mb-8 shadow-md max-w-4xl mx-auto">
                        <span className="text-slate-300 font-medium text-lg mb-3 md:mb-0">
                            <i className="fa-solid fa-layer-group mr-2 text-orange-400"></i>เลือกหมวดหมู่ปฏิกิริยา:
                        </span>
                        <div className="relative w-full md:w-72">
                            <select 
                                className="w-full appearance-none bg-[#1e293b] border border-slate-600 text-white px-5 py-3 rounded-xl outline-none focus:border-orange-500 cursor-pointer transition-all shadow-sm text-base font-medium"
                                value={catIdx} onChange={(e) => { Sound.click(soundEnabled); setCatIdx(Number(e.target.value)); setEqIdx(0); }}
                            >
                                {db.map((cat, i) => <option key={i} value={i} className="bg-slate-800">{cat.category}</option>)}
                            </select>
                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-300">
                                <i className="fa-solid fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>

                    {isFinished ? (
                        <div className="text-center mt-20 animate-fade-in glass p-12 rounded-3xl border border-green-500/30 max-w-4xl mx-auto">
                            <i className="fa-solid fa-medal text-6xl text-yellow-400 mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]"></i>
                            <h2 className="text-3xl font-bold mb-2">ยินดีด้วย ผู้พิทักษ์กฎทรงมวล!</h2>
                            <p className="text-slate-300 mb-6 text-lg">คุณทำโจทย์หมวด "{category.category}" สำเร็จครบทุกข้อแล้วครับ</p>
                            <button onClick={() => { Sound.click(soundEnabled); setEqIdx(0); }} className="px-8 py-3 bg-[#1e293b] border border-slate-600 rounded-xl hover:bg-slate-700 transition-colors shadow-lg font-bold">
                                <i className="fa-solid fa-rotate-left mr-2"></i> ทำหมวดนี้อีกครั้ง
                            </button>
                        </div>
                    ) : (
                        <div>
                            <div className="text-center text-slate-400 mb-4 font-medium text-lg">ข้อที่ <span className="text-orange-400">{eqIdx + 1}</span> / {category.equations.length}</div>
                            <EquationSolver key={`${catIdx}-${eqIdx}`} equation={{...category.equations[eqIdx], categoryName: category.category}} showStateSymbols={showStateSymbols} showParticles={showParticles} onToggleStateSymbols={onToggleStateSymbols} onToggleParticles={onToggleParticles} soundEnabled={soundEnabled} onNext={handleNext} />
                        </div>
                    )}
                </div>
            );
        };

        // 3. Main App Container
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [showStateSymbols, setShowStateSymbols] = useState(true);
            const [showParticles, setShowParticles] = useState(false);
            const [soundEnabled, setSoundEnabled] = useState(true);

            const handleTabSwitch = (tab) => {
                Sound.click(soundEnabled);
                setActiveTab(tab);
            };

            const renderTab = () => {
                const props = { 
                    showStateSymbols, 
                    onToggleStateSymbols: () => { Sound.click(soundEnabled); setShowStateSymbols(!showStateSymbols); },
                    showParticles, 
                    onToggleParticles: () => { Sound.click(soundEnabled); setShowParticles(!showParticles); },
                    soundEnabled
                };
                switch(activeTab) {
                    case 'home': return <HomeTab />;
                    case 'step': return <StepByStepTab {...props} />;
                    case 'free': return <FreePlayTab {...props} />;
                    case 'bank': return <BankTab {...props} />;
                    default: return <HomeTab />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8">
                    <nav className="w-full max-w-6xl mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6 glass px-6 md:px-8 py-4 rounded-2xl relative z-[120]">
                        <div className="text-2xl font-bold tracking-wider text-white drop-shadow-md flex items-center gap-2.5">
                            <i className="fa-solid fa-flask text-orange-500"></i>
                            <div>Phatthana <span className="text-orange-500">Lab</span></div>
                        </div>
                        <div className="w-full lg:w-auto">
                            <ScaleToFit>
                                <div className="flex flex-nowrap justify-center items-center gap-4 md:gap-8 text-sm md:text-[1.05rem] font-medium px-2">
                                    <button onClick={() => handleTabSwitch('home')} className={`pb-1 border-b-2 transition-colors whitespace-nowrap ${activeTab === 'home' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>หน้าแรก</button>
                                    <button onClick={() => handleTabSwitch('step')} className={`pb-1 border-b-2 transition-colors whitespace-nowrap ${activeTab === 'step' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>เรียนทีละขั้น</button>
                                    <button onClick={() => handleTabSwitch('free')} className={`pb-1 border-b-2 transition-colors whitespace-nowrap ${activeTab === 'free' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>เล่นอิสระ</button>
                                    <button onClick={() => handleTabSwitch('bank')} className={`pb-1 border-b-2 transition-colors whitespace-nowrap ${activeTab === 'bank' ? 'text-orange-500 border-orange-500' : 'text-slate-400 border-transparent hover:text-white'}`}>คลังโจทย์</button>
                                    
                                    <div className="h-6 w-px bg-slate-700 mx-1"></div>
                                    <button 
                                        onClick={() => { Sound.click(!soundEnabled); setSoundEnabled(!soundEnabled); }} 
                                        className={`flex items-center justify-center w-9 h-9 rounded-full transition-all shrink-0 ${soundEnabled ? 'text-green-400 bg-slate-800 hover:bg-slate-700' : 'text-slate-500 bg-slate-800/50 hover:bg-slate-800'}`}
                                        title={soundEnabled ? "ปิดเสียง" : "เปิดเสียง"}
                                    >
                                        <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                    </button>
                                </div>
                            </ScaleToFit>
                        </div>
                    </nav>
                    <main className="flex-grow w-full overflow-x-hidden">
                        {renderTab()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
